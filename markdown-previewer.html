<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML & PDF Export</title>

    <!-- Correct CDN links for marked, jsPDF, dompurify, and html2canvas -->
    <script type="module">
        import { marked } from 'https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js';
        document.addEventListener('DOMContentLoaded', function () {
            const markdownInput = document.getElementById('markdown-input');
            const preview = document.getElementById('preview');
            const copyBtn = document.getElementById('copy-btn');
            const wordCount = document.getElementById('word-count');
            const charCount = document.getElementById('char-count');
            const themeSelect = document.getElementById('theme-select');
            const printBtn = document.getElementById('print-btn');
            const responseTime = document.getElementById('response-time');
            const filenameInput = document.getElementById('filename-input');
            const saveBtn = document.getElementById('save-btn');

            // Responsive: Debounce rendering for performance
            let renderTimeout;
            function debounceRenderMarkdown() {
                clearTimeout(renderTimeout);
                renderTimeout = setTimeout(renderMarkdown, 200);
            }

            // Load from localStorage
            if (localStorage.getItem('markdownInput')) {
                markdownInput.value = localStorage.getItem('markdownInput');
            }
            // Load filename from localStorage
            if (localStorage.getItem('markdownFilename')) {
                filenameInput.value = localStorage.getItem('markdownFilename');
            }

            // Function to render Markdown to HTML using marked.parse and sanitize
            function renderMarkdown() {
                const start = performance.now();
                const markdownText = markdownInput.value;
                localStorage.setItem('markdownInput', markdownText);
                const htmlContent = marked.parse(markdownText);
                // Sanitize output
                preview.innerHTML = DOMPurify.sanitize(htmlContent);
                // Syntax highlight code blocks
                preview.querySelectorAll('pre code').forEach(block => {
                    window.hljs.highlightElement(block);
                });
                // Add copy button to each pre block
                preview.querySelectorAll('pre').forEach(pre => {
                    if (!pre.querySelector('.pre-copy-btn')) {
                        const btn = document.createElement('button');
                        btn.textContent = 'Copy';
                        btn.className = 'pre-copy-btn';
                        btn.title = 'Copy code to clipboard';
                        btn.style.position = 'absolute';
                        btn.style.top = '8px';
                        btn.style.right = '8px';
                        btn.style.padding = '4px 10px';
                        btn.style.fontSize = '13px';
                        btn.style.background = '#4CAF50';
                        btn.style.color = '#fff';
                        btn.style.border = 'none';
                        btn.style.borderRadius = '4px';
                        btn.style.cursor = 'pointer';
                        btn.style.zIndex = '2';
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const code = pre.querySelector('code');
                            if (code) {
                                navigator.clipboard.writeText(code.textContent).then(() => {
                                    btn.textContent = 'Copied!';
                                    setTimeout(() => btn.textContent = 'Copy', 1200);
                                });
                            }
                        });
                        pre.style.position = 'relative';
                        pre.appendChild(btn);
                    }
                });
                updateCounts(markdownText);
                const end = performance.now();
                responseTime.textContent = `Conversion time: ${(end - start).toFixed(2)} ms`;
            }

            // Update word/char count
            function updateCounts(text) {
                const words = text.trim().split(/\s+/).filter(Boolean);
                wordCount.textContent = 'Words: ' + words.length;
                charCount.textContent = 'Characters: ' + text.length;
            }

            // Event listener for real-time Markdown rendering (debounced)
            markdownInput.addEventListener('input', debounceRenderMarkdown);

            // Initial render
            renderMarkdown();

            // Copy HTML button
            copyBtn.addEventListener('click', function () {
                navigator.clipboard.writeText(preview.innerHTML)
                    .then(() => {
                        copyBtn.textContent = 'Copied!';
                        setTimeout(() => copyBtn.textContent = 'Copy HTML', 1200);
                    })
                    .catch(() => alert('Copy failed.'));
            });

            // Theme selection
            function setTheme(theme) {
                document.body.classList.remove('theme-light', 'theme-dark', 'theme-solarized', 'theme-high-contrast');
                document.body.classList.add('theme-' + theme);
                localStorage.setItem('theme', theme);
            }
            themeSelect.addEventListener('change', function () {
                setTheme(themeSelect.value);
            });
            // Restore theme
            const savedTheme = localStorage.getItem('theme') || 'light';
            themeSelect.value = savedTheme;
            setTheme(savedTheme);

            // Print button
            printBtn.addEventListener('click', function () {
                // Copy theme class to html for print
                const themeClass = Array.from(document.body.classList).find(c => c.startsWith('theme-'));
                document.documentElement.classList.add(themeClass);
                window.print();
                setTimeout(() => {
                    document.documentElement.classList.remove(themeClass);
                }, 1000);
            });

            // Filename input: switch to editable on click/focus
            filenameInput.addEventListener('click', function() {
                filenameInput.readOnly = false;
                filenameInput.focus();
            });
            filenameInput.addEventListener('blur', function() {
                filenameInput.readOnly = true;
                localStorage.setItem('markdownFilename', filenameInput.value);
            });
            filenameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    filenameInput.readOnly = true;
                    localStorage.setItem('markdownFilename', filenameInput.value);
                    saveBtn.focus();
                }
            });

            // Save Markdown to file
            saveBtn.addEventListener('click', function() {
                let filename = filenameInput.value.trim();
                if (!filename) filename = 'document.md';
                if (!filename.endsWith('.md')) filename += '.md';
                const blob = new Blob([markdownInput.value], { type: 'text/markdown' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(a.href);
                }, 100);
                saveBtn.textContent = 'Saved!';
                setTimeout(() => saveBtn.textContent = 'Save', 1200);
            });
        });
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 5px;
            background-color: #f9f9f9;
            transition: background 0.3s, color 0.3s;
        }
        /* Style checkboxes in the Markdown preview */
        #preview input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid #4CAF50;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            position: relative;
            vertical-align: middle;
            transition: border-color 0.2s, background 0.2s;
        }
        #preview input[type="checkbox"]:checked {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        #preview input[type="checkbox"][disabled] {
            opacity: 0.6;
            cursor: not-allowed;
            background: #fff;
            border-color: #4CAF50;
        }
        #preview input[type="checkbox"][disabled]:checked {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        #preview input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 0px;
            width: 4px;
            height: 8px;
            border: solid #fff;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
            pointer-events: none;
        }

        .main-content {
            display: flex;
            gap: 5px;
            align-items: flex-start;
        }
        textarea {
            width: 100%;
            height: calc(100vh - 80px);
            font-family: monospace;
            margin-bottom: 0;
            resize: none;
            flex: 1 1 50%;
            box-sizing: border-box;
            min-height: 200px;
        }
        #preview {
            border: 1px solid #ddd;
            padding: 20px;
            background-color: #fff;
            min-height: 200px;
            height: calc(100vh - 80px);
            overflow-x: auto;
            flex: 1 1 50%;
            box-sizing: border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #preview table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: inherit;
        }
        #preview th, #preview td {
            padding: 10px;
            text-align: left;
            border: none;
        }
        #preview th {
            background-color: #f0f0f0;
            font-weight: bold;
        }
        #preview tr {
            border-bottom: 1px solid #ddd;
        }
        #preview pre {
            background: #f5f5f5;
            border-radius: 6px;
            padding: 5px 5px;
            margin: 10px 0;
            font-size: 15px;
            font-family: 'Fira Mono', 'Consolas', 'Menlo', 'Monaco', monospace;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .theme-dark #preview pre {
            background: #222;
            color: #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .theme-solarized #preview pre {
            background: #eee8d5;
            color: #657b83;
        }
        .theme-high-contrast #preview pre {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
        }
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
                gap: 0;
            }
            textarea, #preview {
                min-width: 0;
                width: 100%;
                min-height: 200px;
            }
        }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button[title] {
            position: relative;
        }
        button:hover {
            background-color: #45a049;
        }
        #word-count, #char-count, #response-time {
            margin-left: 15px;
            font-size: 14px;
            color: #888;
        }
        select#theme-select {
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid #4CAF50;
            background: #fff;
            color: #222;
            font-size: 15px;
            margin-left: 8px;
            transition: background 0.2s, color 0.2s;
        }
        .theme-dark select#theme-select {
            background: #222;
            color: #eee;
            border-color: #45a049;
        }
        .theme-solarized select#theme-select {
            background: #eee8d5;
            color: #657b83;
            border-color: #b58900;
        }
        .theme-high-contrast select#theme-select {
            background: #000;
            color: #fff;
            border-color: #fff;
        }
        select#theme-select:focus {
            outline: 2px solid #4CAF50;
        }
        /* Filename input: plain text look, styled on focus */
        #filename-input {
            border: none;
            background: transparent;
            color: #222;
            font-size: 15px;
            padding: 8px 10px;
            min-width: 120px;
            transition: all 0.2s;
            cursor: pointer;
        }
        #filename-input:focus, #filename-input:not([readonly]) {
            border: 1px solid #4CAF50;
            background: #fff;
            color: #222;
            outline: none;
            cursor: text;
        }
        .theme-dark #filename-input {
            color: #eee;
            background: transparent;
        }
        .theme-dark #filename-input:focus, .theme-dark #filename-input:not([readonly]) {
            background: #222;
            color: #eee;
            border-color: #45a049;
        }
        .theme-solarized #filename-input {
            color: #657b83;
            background: transparent;
        }
        .theme-solarized #filename-input:focus, .theme-solarized #filename-input:not([readonly]) {
            background: #eee8d5;
            color: #657b83;
            border-color: #b58900;
        }
        .theme-high-contrast #filename-input {
            color: #fff;
            background: transparent;
        }
        .theme-high-contrast #filename-input:focus, .theme-high-contrast #filename-input:not([readonly]) {
            background: #000;
            color: #fff;
            border-color: #fff;
        }
        /* Theme: Dark */
        .theme-dark {
            background-color: #222 !important;
            color: #eee !important;
        }
        .theme-dark #preview {
            background-color: #333 !important;
            color: #eee !important;
            border-color: #444 !important;
        }
        .theme-dark textarea {
            background-color: #222 !important;
            color: #eee !important;
            border-color: #444 !important;
        }
        .theme-dark #preview th {
            background-color: #444;
            color: #eee;
        }
        .theme-dark #preview tr {
            border-bottom: 1px solid #444;
        }
        /* Theme: Solarized */
        .theme-solarized {
            background-color: #fdf6e3 !important;
            color: #657b83 !important;
        }
        .theme-solarized #preview {
            background-color: #eee8d5 !important;
            color: #657b83 !important;
            border-color: #b58900 !important;
        }
        .theme-solarized textarea {
            background-color: #fdf6e3 !important;
            color: #657b83 !important;
            border-color: #b58900 !important;
        }
        .theme-solarized #preview th {
            background-color: #eee8d5;
            color: #657b83;
        }
        .theme-solarized #preview tr {
            border-bottom: 1px solid #b58900;
        }
        /* Theme: High Contrast */
        .theme-high-contrast {
            background-color: #000 !important;
            color: #fff !important;
        }
        .theme-high-contrast #preview {
            background-color: #000 !important;
            color: #fff !important;
            border-color: #fff !important;
        }
        .theme-high-contrast textarea {
            background-color: #000 !important;
            color: #fff !important;
            border-color: #fff !important;
        }
        .theme-high-contrast #preview th {
            background-color: #222;
            color: #fff;
        }
        .theme-high-contrast #preview tr {
            border-bottom: 1px solid #fff;
        }
        /* Theme: Light (default) */
        .theme-light {
            background-color: #f9f9f9 !important;
            color: #222 !important;
        }
        .theme-light #preview {
            background-color: #fff !important;
            color: #222 !important;
            border-color: #ddd !important;
        }
        .theme-light textarea {
            background-color: #fff !important;
            color: #222 !important;
            border-color: #ddd !important;
        }
        /* Heading colors for each theme */
        .theme-dark #preview h1 { color: #eee; }
        .theme-solarized #preview h1 { color: #586e75; }
        .theme-high-contrast #preview h1 { color: #fff; }
        .theme-dark #preview h2 { color: #ccc; }
        .theme-solarized #preview h2 { color: #657b83; }
        .theme-high-contrast #preview h2 { color: #fff; }
        .theme-dark #preview p { color: #bbb; }
        .theme-solarized #preview p { color: #657b83; }
        .theme-high-contrast #preview p { color: #fff; }
        .theme-dark #preview code { background-color: #222; color: #eee; }
        .theme-solarized #preview code { background-color: #eee8d5; color: #657b83; }
        .theme-high-contrast #preview code { background-color: #000; color: #fff; }
        .theme-dark #preview li { color: #ccc; }
        .theme-solarized #preview li { color: #657b83; }
        .theme-high-contrast #preview li { color: #fff; }
        #preview code {
            padding: 2px 4px;
            border-radius: 4px;
        }
        #preview blockquote {
            background-color: #f0f0f0;
            border-left: 5px solid #ccc;
            padding: 3px 12px;
            margin: 5px 0px 5px 0px;
        }
        #preview blockquote p {
            margin-top: 5px;
            margin-bottom: 5px;
        }
        .theme-dark #preview blockquote { background-color: #222; border-left: 5px solid #888; color: #aaa; }
        .theme-solarized #preview blockquote { background-color: #eee8d5; border-left: 5px solid #b58900; color: #657b83; }
        .theme-high-contrast #preview blockquote { background-color: #000; border-left: 5px solid #fff; color: #fff; }
        /* Print only preview, allow multi-page */
        @media print {
            /* Ensure checkboxes use the same color in print */
            #preview input[type="checkbox"] {
                width: 16px !important;
                height: 16px !important;
                background: #fff !important;
                border: 2px solid #4CAF50 !important;
            }
            #preview input[type="checkbox"]:checked {
                background: #4CAF50 !important;
                border-color: #4CAF50 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            #preview input[type="checkbox"][disabled] {
                background: #fff !important;
                border-color: #4CAF50 !important;
                opacity: 0.6 !important;
            }
            #preview input[type="checkbox"][disabled]:checked {
                background: #4CAF50 !important;
                border-color: #4CAF50 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            /* Hide everything except preview */
            .toolbar, .main-content textarea {
                display: none !important;
            }
            #preview {
                display: block !important;
                width: 100% !important;
                min-height: 100vh !important;
                box-shadow: none !important;
                border: none !important;
                background: none !important;
                color: inherit !important;
                page-break-after: auto !important;
                page-break-inside: avoid !important;
                height: auto !important;
                max-height: none !important;
            }
            /* Children backgrounds preserved, but not #preview itself */
            #preview td {
                background-color: transparent !important;
            }
            #preview pre, #preview code {
                white-space: pre-wrap !important;
                word-break: break-word !important;
                overflow: visible !important;
                max-width: 100% !important;
            }
            #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
            }
            #preview p, #preview ul, #preview ol, #preview table, #preview blockquote, #preview pre {
                page-break-before: avoid !important;
                page-break-inside: avoid !important;
            }
            #preview * {
                page-break-after: auto;
                page-break-inside: avoid;
            }
            .pre-copy-btn {
                display: none !important;
            }
            /* Theme-specific backgrounds for children only */
            #preview blockquote {
                background-color: #f0f0f0 !important;
                border-left: 5px solid #ccc !important;
                color: #222 !important;
            }
            .theme-dark #preview blockquote {
                background-color: #222 !important;
                border-left: 5px solid #888 !important;
                color: #aaa !important;
            }
            .theme-solarized #preview blockquote {
                background-color: #eee8d5 !important;
                border-left: 5px solid #b58900 !important;
                color: #657b83 !important;
            }
            .theme-high-contrast #preview blockquote {
                background-color: #000 !important;
                border-left: 5px solid #fff !important;
                color: #fff !important;
            }
            #preview th {
                background-color: #f0f0f0 !important;
                color: #222 !important;
            }
            .theme-dark #preview th {
                background-color: #444 !important;
                color: #eee !important;
            }
            .theme-solarized #preview th {
                background-color: #eee8d5 !important;
                color: #657b83 !important;
            }
            .theme-high-contrast #preview th {
                background-color: #222 !important;
                color: #fff !important;
            }
        }
        /* Style for pre block copy button */
        .pre-copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            font-size: 13px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            z-index: 2;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .pre-copy-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button id="copy-btn" title="Copy rendered HTML to clipboard">Copy HTML</button>
        <button id="print-btn" title="Print preview area. For accurate theme colors, enable 'Print backgrounds' or 'Background graphics' in your browser's print dialog.">Print</button>
        <input id="filename-input" type="text" value="document.md" title="Filename for saving" readonly />
        <button id="save-btn" title="Save Markdown to file">Save</button>
        <label for="theme-select">Theme:</label>
        <select id="theme-select" title="Choose preview theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="solarized">Solarized</option>
            <option value="high-contrast">High Contrast</option>
        </select>
