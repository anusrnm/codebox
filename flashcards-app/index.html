<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Flashcards</title>
  <link
    rel="icon"
    type="image/png"
    href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMB/6X8xQAAAABJRU5ErkJggg=="
  />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Flashcards</h1>
      <div class="header-controls">
        <label class="field">
          <span>Subject</span>
          <select id="subjectSelect"></select>
        </label>
        <label class="field">
          <span>Mode</span>
          <select id="modeSelect"></select>
        </label>
        <label class="field" id="multiplyByField" style="display:none">
          <span>Number</span>
          <input id="multiplyByInput" type="number" min="1" value="5" style="width:60px;padding:4px 8px;border-radius:6px;border:1px solid #374151;background:#1f2937;color:#f9fafb;font-size:1rem" />
        </label>
      </div>
    </header>

    <main class="app-main">
      <section class="card-shell">
        <div id="flashcard" class="card card-animate-in">
          <div class="card-front">
            <div class="card-main" id="cardMain"></div>
            <div class="card-sub" id="cardSub"></div>
          </div>
        </div>
      </section>

      <section class="controls">
        <button id="prevBtn" class="btn secondary" type="button">◀ Prev</button>
        <button id="shuffleBtn" class="btn ghost" type="button">Shuffle</button>
        <button id="nextBtn" class="btn primary" type="button">Next ▶</button>
      </section>

      <section class="progress">
        <span id="progressText">0 / 0</span>
      </section>
    </main>

    <footer class="app-footer">
      <span>Tip: Add this page to your home screen for offline use.</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
