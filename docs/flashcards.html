<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Flashcards</title>
  <link
    rel="icon"
    type="image/png"
    href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMB/6X8xQAAAABJRU5ErkJggg=="
  />
  <style>:root {
  --bg: #020617;
  --bg-elevated: #020617;
  --bg-card: #020617;
  --accent: #38bdf8;
  --accent-soft: rgba(56, 189, 248, 0.25);
  --accent-strong: #22d3ee;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --danger: #f97373;
  --radius-lg: 18px;
  --radius-xl: 26px;
  --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.95);
  --transition-fast: 150ms ease-out;
  --transition-med: 260ms cubic-bezier(0.22, 0.61, 0.36, 1);
  --card-max-height: 60vh;
  --card-main-font-min: 2rem;
  --card-main-font-vw: 10vw;
  --card-main-font-max: 4.8rem;
  --card-sub-font-min: 1.05rem;
  --card-sub-font-vw: 3.4vw;
  --card-sub-font-max: 1.35rem;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #0f172a 0, #020617 52%);
  color: var(--text);
}

body {
  display: flex;
  align-items: stretch;
  justify-content: center;
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  width: 100%;
  padding: 16px 16px 10px;
}

.app-header {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 14px 8px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.8));
  border: 1px solid rgba(148, 163, 184, 0.18);
  box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(12px);
}

.app-header h1 {
  margin: 0;
  font-size: 1.35rem;
  letter-spacing: 0.04em;
  background: linear-gradient(135deg, #f9fafb, #e5e7eb, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}

.header-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.field {
  flex: 1 1 130px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
}

.field select {
  color-scheme: dark;
  background-color: #0b1220;
  background: radial-gradient(circle at top left, #0b1220 0, #020617 62%);
  color: var(--text);
  border-radius: 999px;
  border: 1px solid rgba(148, 163, 184, 0.4);
  padding: 8px 10px;
  font-size: 0.9rem;
  outline: none;
  box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.9);
}

.field select option,
.field select optgroup {
  background-color: #0f172a;
  color: var(--text);
}

.app-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: stretch;
  padding: 12px 0 4px;
}

.card-shell {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
  perspective: 1200px;
}

.card {
  position: relative;
  width: 100%;
  aspect-ratio: 2.6/4;
  max-height: var(--card-max-height);
  border-radius: var(--radius-xl);
  background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), transparent 58%),
    radial-gradient(circle at bottom right, rgba(94, 234, 212, 0.18), transparent 60%),
    radial-gradient(circle at top, #020617, #020617 60%);
  border: 1px solid rgba(148, 163, 184, 0.4);
  box-shadow: var(--shadow-soft);
  overflow: visible;
  padding: 20px 18px 18px;
  display: flex;
  align-items: stretch;
  justify-content: center;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top, rgba(56, 189, 248, 0.16), transparent 56%);
  opacity: 0.2;
  pointer-events: none;
}

.card-front {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
}

.card-main {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 100%;
  font-size: clamp(var(--card-main-font-min), var(--card-main-font-vw), var(--card-main-font-max));
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1.15;
  overflow-wrap: anywhere;
  text-align: center;
  text-shadow: 0 20px 45px rgba(0, 0, 0, 0.75);
}

.card-sub {
  margin-top: 10px;
  text-align: center;
  font-size: clamp(var(--card-sub-font-min), var(--card-sub-font-vw), var(--card-sub-font-max));
  color: var(--muted);
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 6px;
  flex-wrap: wrap;
}

.btn-group {
  display: flex;
  gap: 0px;
  align-items: center;
}

.btn {
  border-radius: 999px;
  border: none;
  padding: 6px 10px;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  white-space: nowrap;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast),
    background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
}

.btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-strong));
  color: #0f172a;
  box-shadow: 0 14px 35px rgba(56, 189, 248, 0.55);
}

.btn.secondary {
  background: radial-gradient(circle at top left, rgba(148, 163, 184, 0.5), rgba(148, 163, 184, 0.2));
  color: #020617;
  border: 1px solid rgba(148, 163, 184, 0.7);
}

.btn.ghost {
  background: transparent;
  color: var(--accent);
  border: 1px solid rgba(56, 189, 248, 0.6);
  box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.9);
}

.btn.navigation {
  min-width: 112px;
  min-height: 48px;
  padding: 12px 18px;
  font-size: 1rem;
  font-weight: 600;
}

.btn:active {
  transform: translateY(1px) scale(0.99);
  box-shadow: 0 6px 16px rgba(15, 23, 42, 0.7);
}

.btn:focus-visible {
  outline: 2px solid rgba(56, 189, 248, 0.9);
  outline-offset: 2px;
}

.progress {
  margin-top: 8px;
  text-align: center;
  font-size: 0.85rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.app-footer {
  padding-top: 4px;
  padding-bottom: 2px;
  font-size: 0.75rem;
  text-align: center;
  color: var(--muted);
}

/* Mobile tweaks */

@media (max-width: 600px) {
  .app {
    padding: 10px 10px 8px;
  }

  .app-header {
    padding-inline: 12px;
  }

  .controls {
    gap: 6px;
  }

  .btn-group {
    gap: 4px;
  }

  .btn {
    padding-inline: 12px;
  }
}

</style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Flashcards</h1>
      <div class="header-controls">
        <label class="field">
          <span>Subject</span>
          <select id="subjectSelect"></select>
        </label>
        <label class="field">
          <span>Mode</span>
          <select id="modeSelect"></select>
        </label>
        <label class="field" id="multiplyByField" style="display:none">
          <span>Number</span>
          <input id="multiplyByInput" type="number" min="1" value="5" style="width:60px;padding:4px 8px;border-radius:6px;border:1px solid #374151;background:#1f2937;color:#f9fafb;font-size:1rem" />
        </label>
      </div>
    </header>

    <main class="app-main">
      <section class="card-shell">
        <div id="flashcard" class="card">
          <div class="card-front">
            <div class="card-main" id="cardMain"></div>
            <div class="card-sub" id="cardSub"></div>
          </div>
        </div>
      </section>

      <section class="controls">
        <button id="prevBtn" class="btn secondary navigation" type="button">◀ Previous</button>
        <button id="shuffleBtn" class="btn ghost" type="button">Shuffle</button>
        <button id="nextBtn" class="btn primary navigation" type="button">Next ▶</button>
      </section>

      <section class="progress">
        <span id="progressText">0 / 0</span>
      </section>
    </main>

    <footer class="app-footer">
      <span>Tip: Add this page to your home screen for offline use.</span>
    </footer>
  </div>

  <script>const DEV = {
  VIRAMA: "\u094D",
  KA: "\u0915",
  KHA: "\u0916",
  GA: "\u0917",
  GHA: "\u0918",
  CHA: "\u091A",
  JA: "\u091C",

  SA: "\u0938",
  SHA: "\u0936",
  RA: "\u0930",
  YA: "\u092F",
  VA: "\u0935"
};

function makeHindiCluster(first, second, label) {
  return {
    main: first + DEV.VIRAMA + second,
    sub: label || ""
  };
}

function generateHindiClusters() {
  const pairs = [
    // Combinations with RA (र) as second consonant
    [DEV.KA, DEV.RA, "क्र (kra)"],

    [DEV.GHA, DEV.RA, "घ्र (ghra)"],

    [DEV.DA, DEV.RA, "द्र (dra)"],

    [DEV.SA, DEV.RA, "स्र (sra)"],
    [DEV.VA, DEV.RA, "व्र (vra)"],
    
    // Combinations with YA (य) as second consonant
    [DEV.KA, DEV.YA, "क्य (kya)"],
    [DEV.KHA, DEV.YA, "ख्य (khya)"],
    [DEV.GA, DEV.YA, "ग्य (gya)"],
    [DEV.GHA, DEV.YA, "घ्य (ghya)"],
    [DEV.CHA, DEV.YA, "च्य (chya)"],

    [DEV.THA, DEV.YA, "थ्य (thya)"],
    [DEV.DA, DEV.YA, "द्य (dya)"],
    [DEV.DHA, DEV.YA, "ध्य (dhya)"],
    [DEV.PA, DEV.YA, "प्य (pya)"],
    [DEV.BA, DEV.YA, "ब्य (bya)"],
    [DEV.SHA, DEV.YA, "श्य (shya)"],
    [DEV.SA, DEV.YA, "स्य (sya)"],
    [DEV.VA, DEV.YA, "व्य (vya)"],
    
    // Combinations with VA (व) as second consonant
    [DEV.KA, DEV.VA, "क्व (kva)"],
    [DEV.KHA, DEV.VA, "ख्व (khva)"],
    [DEV.GA, DEV.VA, "ग्व (gva)"],
    [DEV.GHA, DEV.VA, "घ्व (ghva)"],
    [DEV.JA, DEV.VA, "ज्व (jva)"],
    [DEV.TA, DEV.VA, "त्व (tva)"],
    [DEV.THA, DEV.VA, "थ्व (thva)"],
    [DEV.DA, DEV.VA, "द्व (dva)"],
    [DEV.DHA, DEV.VA, "ध्व (dhva)"],
    [DEV.PA, DEV.VA, "प्व (pva)"],
    [DEV.SHA, DEV.VA, "श्व (shva)"],
    [DEV.SA, DEV.VA, "स्व (sva)"],
    
    // Combinations with TA (त) as second consonant
    [DEV.KA, DEV.TA, "क्त (kta)"],
    [DEV.KHA, DEV.TA, "ख्त (khta)"],
    [DEV.GA, DEV.TA, "ग्त (gta)"],
    [DEV.GHA, DEV.TA, "घ्त (ghta)"],
    [DEV.CHA, DEV.TA, "च्त (chta)"],
    [DEV.JA, DEV.TA, "ज्त (jta)"],
    [DEV.PA, DEV.TA, "प्त (pta)"],
    [DEV.BA, DEV.TA, "ब्त (bta)"],
    [DEV.SHA, DEV.TA, "श्त (shta)"],
    [DEV.SA, DEV.TA, "स्त (sta)"],
    
    // Combinations with THA (थ) as second consonant
    [DEV.KA, DEV.THA, "क्थ (ktha)"],
    [DEV.GA, DEV.THA, "ग्थ (gtha)"],
    [DEV.PA, DEV.THA, "प्थ (ptha)"],
    [DEV.SA, DEV.THA, "स्थ (stha)"]
  ];

  return pairs.map(([a, b, label]) => makeHindiCluster(a, b, label));
}

function generateOneMathCard(op) {
  let a, b, question, answer;
  switch (op) {
    case "addition":
      a = Math.floor(Math.random() * 50) + 1;
      b = Math.floor(Math.random() * 50) + 1;
      question = a + " + " + b;
      answer = a + b;
      break;
    case "subtraction":
      a = Math.floor(Math.random() * 50) + 10;
      b = Math.floor(Math.random() * a) + 1;
      question = a + " − " + b;
      answer = a - b;
      break;
    case "multiplication":
      a = Math.floor(Math.random() * 12) + 2;
      b = Math.floor(Math.random() * 12) + 2;
      question = a + " × " + b;
      answer = a * b;
      break;
    case "division":
      b = Math.floor(Math.random() * 12) + 2;
      answer = Math.floor(Math.random() * 12) + 1;
      a = b * answer;
      question = a + " ÷ " + b;
      break;
    case "multiply_by": {
      var n = getMultiplyByNumber();
      var repeated = buildRepeatedNumbers(n);
      var pick = repeated[Math.floor(Math.random() * repeated.length)];
      b = Math.floor(Math.random() * 12) + 1;
      question = pick + " × " + b;
      answer = pick * b;
      break;
    }
  }
  return { main: question, sub: "= " + answer };
}

function getMultiplyByNumber() {
  var input = document.getElementById("multiplyByInput");
  var val = parseInt(input ? input.value : "5", 10);
  return val > 0 ? val : 5;
}

function buildRepeatedNumbers(n) {
  var results = [];
  var s = "";
  for (var i = 0; i < 4; i++) {
    s += String(n);
    results.push(parseInt(s, 10));
  }
  return results;
}

function nextMathCard() {
  var ops = ["addition", "subtraction", "multiplication", "division"];
  var op = currentMode === "all"
    ? ops[Math.floor(Math.random() * ops.length)]
    : currentMode;
  return generateOneMathCard(op);
}

const subjects = {
  english: {
    label: "English",
    modes: [
      { value: "letters", label: "Letters" },
      { value: "words", label: "Words" },
      { value: "vyanjan", label: "Vyanjan (Consonants)" },
      { value: "mixed", label: "Mixed consonants" },
      { value: "all", label: "All (Mixed)" }
    ]
  },
  hindi: {
    label: "Hindi (हिन्दी)",
    modes: [
      { value: "letters", label: "Letters" },
      { value: "words", label: "Words" },
      { value: "vyanjan", label: "Vyanjan (Consonants)" },
      { value: "mixed", label: "Mixed consonants" },
      { value: "all", label: "All (Mixed)" }
    ]
  },
  tamil: {
    label: "Tamil (தமிழ்)",
    modes: [
      { value: "letters", label: "Letters" },
      { value: "words", label: "Words" },
      { value: "vyanjan", label: "Vyanjan (Consonants)" },
      { value: "mixed", label: "Mixed consonants" },
      { value: "all", label: "All (Mixed)" }
    ]
  },
  kannada: {
    label: "Kannada (ಕನ್ನಡ)",
    modes: [
      { value: "letters", label: "Letters" },
      { value: "words", label: "Words" },
      { value: "vyanjan", label: "Vyanjan (Consonants)" },
      { value: "mixed", label: "Mixed consonants" },
      { value: "all", label: "All (Mixed)" }
    ]
  },
  maths: {
    label: "Maths",
    modes: [
      { value: "addition", label: "Addition (+)" },
      { value: "subtraction", label: "Subtraction (−)" },
      { value: "multiplication", label: "Multiplication (×)" },
      { value: "division", label: "Division (÷)" },
      { value: "multiply_by", label: "Multiply by N" },
      { value: "all", label: "All (Mixed)" }
    ]
  }
};

function getMixedConsonants(subjectKey) {
  if (subjectKey === "hindi") {
    return generateHindiClusters();
  }

  const lang = languages[subjectKey];
  if (!lang || !Array.isArray(lang.vyanjan)) return [];
  return lang.vyanjan;
}

async function loadTamilWords() {
  try {
    const response = await fetch("words.txt");
    if (!response.ok) return;

    const text = await response.text();
    const places = text
      .split(/\r?\n/u)
      .filter(function (line) { return line.trim() && !line.startsWith("#"); })
      .map(function (line) {
        const [main, sub = ""] = line.split("\t");
        return { main: main.trim(), sub: sub.trim() };
      });

    languages.tamil.words.push(...places);
  } catch (_error) {
    // Keep the built-in cards available when the optional word list cannot load.
  }
}

const subjectSelect = document.getElementById("subjectSelect");
const modeSelect = document.getElementById("modeSelect");
const cardMain = document.getElementById("cardMain");
const cardSub = document.getElementById("cardSub");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const progressText = document.getElementById("progressText");

let currentSubjectKey = "tamil";
let currentMode = "words";
let currentIndex = 0;
let order = [];
let mathHistory = [];
let mathPosition = -1;
const MATH_HISTORY_MAX = 5;

function initSubjectOptions() {
  Object.entries(subjects).forEach(([key, value]) => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = value.label;
    subjectSelect.appendChild(opt);
  });

  subjectSelect.value = currentSubjectKey;
  updateModeOptions();
}

function updateModeOptions() {
  const subject = subjects[currentSubjectKey];
  if (!subject) return;

  modeSelect.innerHTML = "";
  subject.modes.forEach(function (m) {
    const opt = document.createElement("option");
    opt.value = m.value;
    opt.textContent = m.label;
    modeSelect.appendChild(opt);
  });

  if (!subject.modes.some(function (m) { return m.value === currentMode; })) {
    currentMode = subject.modes[0].value;
  }
  modeSelect.value = currentMode;

  var multiplyByField = document.getElementById("multiplyByField");
  if (multiplyByField) {
    multiplyByField.style.display =
      (currentSubjectKey === "maths" && currentMode === "multiply_by") ? "" : "none";
  }
}

function isMathMode() {
  return currentSubjectKey === "maths";
}

function getCurrentList() {
  if (isMathMode()) return mathHistory;

  const lang = languages[currentSubjectKey];
  if (!lang) return [];

  if (currentMode === "mixed") {
    return getMixedConsonants(currentSubjectKey);
  }

  if (currentMode === "all") {
    const parts = [];
    if (Array.isArray(lang.letters)) parts.push(...lang.letters);
    if (Array.isArray(lang.vyanjan)) parts.push(...lang.vyanjan);
    if (Array.isArray(lang.words)) parts.push(...lang.words);
    return parts;
  }

  return lang[currentMode] ?? [];
}

function resetMathHistory() {
  mathHistory = [nextMathCard()];
  mathPosition = 0;
}

function mathNext() {
  if (mathPosition < mathHistory.length - 1) {
    mathPosition++;
  } else {
    mathHistory.push(nextMathCard());
    mathPosition = mathHistory.length - 1;
    if (mathHistory.length > MATH_HISTORY_MAX + 1) {
      mathHistory.shift();
      mathPosition--;
    }
  }
}

function mathPrev() {
  if (mathPosition > 0) {
    mathPosition--;
  }
}

function buildOrder() {
  if (isMathMode()) {
    resetMathHistory();
    return;
  }
  const list = getCurrentList();
  order = list.map((_, idx) => idx);
  shuffleOrder();
}

function shuffleOrder() {
  for (let i = order.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
}

function clampIndex(idx) {
  if (order.length === 0) return 0;
  if (idx < 0) return order.length - 1;
  if (idx >= order.length) return 0;
  return idx;
}

function renderCard() {
  if (isMathMode()) {
    if (!mathHistory.length) {
      cardMain.textContent = "No data";
      cardSub.textContent = "Try another mode or subject";
      progressText.textContent = "0 / 0";
      return;
    }
    const item = mathHistory[mathPosition];
    cardMain.textContent = item.main;
    cardSub.textContent = item.sub ?? "";
    progressText.textContent = "∞";
    return;
  }

  const list = getCurrentList();
  const total = list.length;

  if (!total) {
    cardMain.textContent = "No data";
    cardSub.textContent = "Try another mode or subject";
    progressText.textContent = "0 / 0";
    return;
  }

  currentIndex = clampIndex(currentIndex);
  const itemIndex = order[currentIndex];
  const item = list[itemIndex];

  cardMain.textContent = item.main;
  cardSub.textContent = item.sub ?? "";

  progressText.textContent = `${currentIndex + 1} / ${total}`;
}

function onSubjectChange() {
  currentSubjectKey = subjectSelect.value;
  currentIndex = 0;
  updateModeOptions();
  buildOrder();
  renderCard();
}

function onModeChange() {
  currentMode = modeSelect.value;
  currentIndex = 0;
  updateModeOptions();
  buildOrder();
  renderCard();
}

function runSwipe(direction) {
  if (!isMathMode() && !order.length) return;

  if (isMathMode()) {
    if (direction === "left") mathPrev();
    else mathNext();
  } else {
    const delta = direction === "left" ? -1 : 1;
    currentIndex = clampIndex(currentIndex + delta);
  }
  renderCard();
}

function onPrev() {
  runSwipe("left");
}

function onNext() {
  runSwipe("right");
}

function onShuffle() {
  if (isMathMode()) {
    resetMathHistory();
    renderCard();
    return;
  }
  if (!order.length) return;
  shuffleOrder();
  currentIndex = 0;
  renderCard();
}

function initEvents() {
  subjectSelect.addEventListener("change", onSubjectChange);
  modeSelect.addEventListener("change", onModeChange);
  prevBtn.addEventListener("click", onPrev);
  nextBtn.addEventListener("click", onNext);
  shuffleBtn.addEventListener("click", onShuffle);

  var multiplyByInput = document.getElementById("multiplyByInput");
  if (multiplyByInput) {
    multiplyByInput.addEventListener("change", function () {
      if (currentSubjectKey === "maths" && currentMode === "multiply_by") {
        resetMathHistory();
        renderCard();
      }
    });
  }

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowLeft") onPrev();
    else if (ev.key === "ArrowRight") onNext();
  });
}

async function init() {
  await loadTamilWords();
  initSubjectOptions();
  buildOrder();
  initEvents();
  renderCard();
}

init();
</script>
