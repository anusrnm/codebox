<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 1rem;
      color: #e0e0e0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .header p {
      opacity: 0.9;
      font-size: 0.9rem;
    }

    .card {
      background: #2d2d44;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .upload-section {
      border: 2px dashed #667eea;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .upload-section:hover {
      border-color: #8b9dff;
      background: #383854;
    }

    .upload-section.drag-over {
      border-color: #8b9dff;
      background: #404060;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .upload-section input[type="file"] {
      display: none;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 1rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .file-list {
      list-style: none;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      border-bottom: 1px solid #3a3a50;
      transition: background 0.2s ease;
    }

    .file-item:hover {
      background: #383854;
    }

    .file-checkbox {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .file-item:last-child {
      border-bottom: none;
    }

    .file-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .file-name {
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 0.2rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .file-meta {
      font-size: 0.8rem;
      color: #a0a0a0;
    }

    .file-actions {
      display: flex;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.4rem;
      border-radius: 6px;
      transition: background 0.2s ease;
      color: #667eea;
      line-height: 1;
    }

    .icon-btn:hover {
      background: #404060;
    }

    .icon-btn.delete:hover {
      color: #ff6b6b;
      background: #4a2b2b;
    }

    .selected-files {
      margin-top: 1rem;
      padding: 1rem;
      background: #383854;
      border-radius: 6px;
    }

    .selected-files-list {
      list-style: none;
      margin-top: 0.5rem;
    }

    .selected-file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem;
      background: #2d2d44;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #ff6b6b;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0.25rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #888;
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #667eea;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .notification {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: #2d2d44;
      color: #e0e0e0;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      z-index: 1000;
      animation: slideIn 0.3s ease;
      max-width: 300px;
    }

    .notification.success {
      border-left: 4px solid #4caf50;
    }

    .notification.error {
      border-left: 4px solid #ff6b6b;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .bulk-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .bulk-actions-hidden {
      display: none;
    }

    .file-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 1rem;
    }

    .file-list-header h2 {
      margin: 0;
    }

    .select-all-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #a0a0a0;
    }

    .btn-small {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
    }

    .btn-delete {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    }

    .btn-delete:hover {
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 1.5rem;
      }

      .card {
        padding: 1rem;
      }

      .upload-section {
        padding: 1.5rem;
      }

      .file-list-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }

      .bulk-actions {
        width: 100%;
        justify-content: space-between;
      }

      .file-item {
        gap: 0.5rem;
      }

      .file-name {
        font-size: 0.9rem;
      }

      .file-meta {
        font-size: 0.75rem;
      }

      .icon-btn {
        font-size: 1rem;
        padding: 0.35rem;
      }

      .notification {
        right: 1rem;
        left: 1rem;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📁 File Manager</h1>
      <p>Upload, download, and manage your files</p>
    </div>

    <div class="card">
      <div class="upload-section" id="uploadSection">
        <div class="upload-icon">☁️</div>
        <h3>Drop files here or click to browse</h3>
        <p style="margin-top: 0.5rem; color: #666;">Support for multiple files</p>
        <input type="file" id="fileInput" multiple>
        <div id="selectedFiles"></div>
        <button class="btn" id="uploadBtn" style="display: none;">Upload Files</button>
      </div>
    </div>

    <div class="card">
      <div class="file-list-header">
        <h2>Your Files</h2>
        <div id="bulkActions" class="bulk-actions bulk-actions-hidden">
          <div class="select-all-container">
            <input type="checkbox" id="selectAll" class="file-checkbox">
            <label for="selectAll" style="cursor: pointer;">Select All</label>
          </div>
          <button class="btn btn-small btn-delete" id="deleteSelectedBtn" style="visibility: hidden;">Delete Selected (<span id="selectedCount">0</span>)</button>
        </div>
      </div>
      <div id="fileListContainer">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading files...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let selectedFiles = [];
    let selectedFileNames = new Set();

    const uploadSection = document.getElementById('uploadSection');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const selectedFilesDiv = document.getElementById('selectedFiles');
    const fileListContainer = document.getElementById('fileListContainer');
    const bulkActions = document.getElementById('bulkActions');
    const selectAllCheckbox = document.getElementById('selectAll');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    const selectedCountSpan = document.getElementById('selectedCount');

    // Load files on page load
    loadFiles();

    // Click to browse
    uploadSection.addEventListener('click', (e) => {
      if (e.target.id !== 'uploadBtn') {
        fileInput.click();
      }
    });

    // File selection
    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    // Drag and drop
    uploadSection.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadSection.classList.add('drag-over');
    });

    uploadSection.addEventListener('dragleave', () => {
      uploadSection.classList.remove('drag-over');
    });

    uploadSection.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadSection.classList.remove('drag-over');
      handleFiles(e.dataTransfer.files);
    });

    // Upload button
    uploadBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await uploadFiles();
    });

    // Select all checkbox
    selectAllCheckbox.addEventListener('change', (e) => {
      const checkboxes = document.querySelectorAll('.file-checkbox:not(#selectAll)');
      checkboxes.forEach(cb => {
        cb.checked = e.target.checked;
        if (e.target.checked) {
          selectedFileNames.add(cb.dataset.filename);
        } else {
          selectedFileNames.clear();
        }
      });
      updateBulkActions();
    });

    // Delete selected button
    deleteSelectedBtn.addEventListener('click', async () => {
      if (selectedFileNames.size === 0) return;
      
      const count = selectedFileNames.size;
      if (!confirm(`Are you sure you want to delete ${count} file(s)?`)) return;
      
      deleteSelectedBtn.disabled = true;
      deleteSelectedBtn.textContent = 'Deleting...';
      
      let successCount = 0;
      let failCount = 0;
      
      for (const filename of selectedFileNames) {
        try {
          const response = await fetch(`/api/delete/${encodeURIComponent(filename)}`, {
            method: 'DELETE'
          });
          if (response.ok) {
            successCount++;
          } else {
            failCount++;
          }
        } catch (error) {
          failCount++;
        }
      }
      
      selectedFileNames.clear();
      updateBulkActions();
      
      if (successCount > 0) {
        showNotification(`Successfully deleted ${successCount} file(s)`, 'success');
      }
      if (failCount > 0) {
        showNotification(`Failed to delete ${failCount} file(s)`, 'error');
      }
      
      loadFiles();
      deleteSelectedBtn.disabled = false;
    });

    function handleFiles(files) {
      selectedFiles = Array.from(files);
      displaySelectedFiles();
    }

    function displaySelectedFiles() {
      if (selectedFiles.length === 0) {
        selectedFilesDiv.innerHTML = '';
        uploadBtn.style.display = 'none';
        return;
      }

      uploadBtn.style.display = 'inline-block';
      
      const html = `
        <div class="selected-files">
          <strong>${selectedFiles.length} file(s) selected:</strong>
          <ul class="selected-files-list">
            ${selectedFiles.map((file, index) => `
              <li class="selected-file-item">
                <span>${file.name} (${formatBytes(file.size)})</span>
                <button class="remove-btn" onclick="removeFile(${index})">✕</button>
              </li>
            `).join('')}
          </ul>
        </div>
      `;
      
      selectedFilesDiv.innerHTML = html;
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      displaySelectedFiles();
    }

    async function uploadFiles() {
      if (selectedFiles.length === 0) return;

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Uploading...';

      const formData = new FormData();
      selectedFiles.forEach(file => {
        formData.append('files', file);
      });

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (response.ok) {
          showNotification(`Successfully uploaded ${result.files.length} file(s)`, 'success');
          selectedFiles = [];
          fileInput.value = '';
          displaySelectedFiles();
          loadFiles();
        } else {
          showNotification('Upload failed: ' + result.error, 'error');
        }
      } catch (error) {
        showNotification('Upload failed: ' + error.message, 'error');
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Upload Files';
      }
    }

    async function loadFiles() {
      try {
        const response = await fetch('/api/files');
        const files = await response.json();

        if (files.length === 0) {
          fileListContainer.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📭</div>
              <p>No files yet. Upload some files to get started!</p>
            </div>
          `;
          bulkActions.classList.add('bulk-actions-hidden');
          return;
        }

        const html = `
          <ul class="file-list">
            ${files.map(file => `
              <li class="file-item">
                <input type="checkbox" class="file-checkbox" data-filename="${escapeHtml(file.name)}" onchange="handleFileSelection(this)">
                <div class="file-info">
                  <div class="file-name">${escapeHtml(file.name)}</div>
                  <div class="file-meta">
                    ${formatBytes(file.size)} • ${formatDate(file.modified)}
                  </div>
                </div>
                <div class="file-actions">
                  <button class="icon-btn" onclick="downloadFile('${encodeURIComponent(file.name)}')" title="Download">
                    ⬇️
                  </button>
                  <button class="icon-btn delete" onclick="deleteFile('${encodeURIComponent(file.name)}')" title="Delete">
                    🗑️
                  </button>
                </div>
              </li>
            `).join('')}
          </ul>
        `;

        fileListContainer.innerHTML = html;
        updateBulkActions();
      } catch (error) {
        fileListContainer.innerHTML = `
          <div class="empty-state">
            <p style="color: #e74c3c;">Failed to load files: ${error.message}</p>
          </div>
        `;
      }
    }

    function handleFileSelection(checkbox) {
      if (checkbox.checked) {
        selectedFileNames.add(checkbox.dataset.filename);
      } else {
        selectedFileNames.delete(checkbox.dataset.filename);
      }
      updateBulkActions();
    }

    function updateBulkActions() {
      const count = selectedFileNames.size;
      selectedCountSpan.textContent = count;
      
      const allCheckboxes = document.querySelectorAll('.file-checkbox:not(#selectAll)');
      const hasFiles = allCheckboxes.length > 0;
      
      // Show bulk actions bar if there are files
      if (hasFiles) {
        bulkActions.classList.remove('bulk-actions-hidden');
      } else {
        bulkActions.classList.add('bulk-actions-hidden');
      }
      
      // Show delete button only if files are selected
      if (count > 0) {
        deleteSelectedBtn.style.visibility = 'visible';
      } else {
        deleteSelectedBtn.style.visibility = 'hidden';
        selectAllCheckbox.checked = false;
      }
      
      // Update select all checkbox state
      const checkedCheckboxes = document.querySelectorAll('.file-checkbox:not(#selectAll):checked');
      selectAllCheckbox.checked = hasFiles && allCheckboxes.length === checkedCheckboxes.length;
      selectAllCheckbox.indeterminate = checkedCheckboxes.length > 0 && checkedCheckboxes.length < allCheckboxes.length;
      
      const buttonText = count === 1 ? 'Delete Selected (1)' : `Delete Selected (${count})`;
      deleteSelectedBtn.innerHTML = buttonText;
    }

    function downloadFile(filename) {
      window.location.href = `/api/download/${filename}`;
    }

    async function deleteFile(filename) {
      if (!confirm('Are you sure you want to delete this file?')) return;

      try {
        const response = await fetch(`/api/delete/${filename}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          showNotification('File deleted successfully', 'success');
          selectedFileNames.delete(decodeURIComponent(filename));
          loadFiles();
        } else {
          const result = await response.json();
          showNotification('Delete failed: ' + result.error, 'error');
        }
      } catch (error) {
        showNotification('Delete failed: ' + error.message, 'error');
      }
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diff = now - date;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));

      if (days === 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 7) return `${days} days ago`;
      
      return date.toLocaleDateString();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showNotification(message, type) {
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.textContent = message;
      document.body.appendChild(notification);

      setTimeout(() => {
        notification.remove();
      }, 3000);
    }

    // Make functions global for onclick handlers
    window.removeFile = removeFile;
    window.downloadFile = downloadFile;
    window.deleteFile = deleteFile;
    window.handleFileSelection = handleFileSelection;
  </script>
</body>
</html>
